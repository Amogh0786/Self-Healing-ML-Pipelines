name: Self-Healing MLOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-pipeline:
    name: MLOps Test Suite & Closed-Loop Simulation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Automated Unit & Integration Tests (17/17 Tests)
      run: |
        pytest tests/ -v -o pythonpath=.

    - name: Verify End-to-End Closed-Loop Demo Pipeline
      run: |
        python demo_pipeline.py
