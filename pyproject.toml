[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-mlops-pipeline"
version = "0.1.0"
description = "Self-Healing Automated Production MLOps Pipeline with FastAPI, MLflow, Airflow, Drift Detection, and Kubernetes"
authors = [
    {name = "Antigravity Engineering", email = "engineering@antigravity.dev"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "mlflow>=2.11.0",
    "sqlalchemy>=2.0.0",
    "kubernetes>=29.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "apache-airflow>=2.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
